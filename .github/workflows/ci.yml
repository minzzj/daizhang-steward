name: CI

on:
  push:
    branches: [main, wip/m0-core]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository self-check（structure + license + prompts + path hygiene）
        run: npm run check

      - name: Secret scan
        run: npm run check:secrets

      - name: Build / typecheck
        run: npm run build

      - name: Unit + integration tests
        run: npm run test:unit

      - name: Acceptance evidence (`steward demo`, MockHarness — no paid API)
        run: npm run evidence

# M1+ jobs:
#   e2e-browser: real headless Chromium against examples/demo-web
#   desktop E2E: local/self-hosted only (hosted CI has no interactive desktop)
