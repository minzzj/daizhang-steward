name: CI

on:
  push:
    branches: [main, wip/m0-core]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository self-check（structure + license + prompts + path hygiene）
        run: npm run check

      - name: Secret scan
        run: npm run check:secrets

      - name: Build / typecheck
        run: npm run build

      - name: Unit + integration tests
        run: npm run test:unit

      - name: Acceptance evidence (`steward demo`, MockHarness — no paid API)
        run: npm run evidence

      - name: Scout demo (fixture-driven; drafts only, never auto-sent — A7)
        run: node dist/apps/cli/src/index.js scout --json

      - name: Phase-2 business domain demo (fixture-driven; B1/B2/B5/B6/B7 — no network)
        run: node dist/apps/cli/src/index.js business --json

      - name: Phase-2 boundary rules check (4 out-of-scope classes must be denied — B7)
        run: node dist/apps/cli/src/index.js boundary-check --json

      - name: Dummy read-only branch demo (config + existing prompt, no core change — A10)
        run: node dist/apps/cli/src/index.js dummy-branch --json

      - name: Safety check (stop key ≤5s / checkpoint / branch isolation — A8/A9)
        run: node dist/apps/cli/src/index.js safety-check

      - name: Fault drill — real localhost network outage (B3, 0.2 min short run)
        run: node dist/apps/cli/src/index.js fault-drill --case net-outage --outage-minutes 0.2 --json

      - name: Fault drill — real localhost platform ban (B4, 0.2 min short run)
        run: node dist/apps/cli/src/index.js fault-drill --case platform-ban --ban-minutes 0.2 --json

      - name: Console E2E (headless real browser; local 127.0.0.1 console)
        run: node tests/e2e-console/run.mjs --headless 1 --evidence-dir runs/ci-console-e2e

      - name: Real-browser E2E (headless Chrome/Edge, demo-web normal flow)
        run: node tests/e2e-browser/login-flow.mjs --case normal --headless 1 --evidence-dir runs/ci-e2e

# Local-only (hosted CI has no interactive desktop):
#   npm run acceptance  — headed real browser: A2 browser flow + A4 code loop + A5 escalation
#   tests/e2e-desktop/  — real Windows UI automation (M2)
